name: Update gallery and deploy

on:
  # Check Facebook for new posts every 3 hours
  schedule:
    - cron: "17 */3 * * *"
  # Deploy whenever the site files are changed
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest posts from Facebook
        id: fetch
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node scripts/fetch-facebook.mjs

      - name: Save new posts to the repo
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update gallery from Facebook"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Flag a Facebook problem
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::The site was deployed, but pulling posts from Facebook failed. Open the 'Pull latest posts from Facebook' step above to see why."
          exit 1
